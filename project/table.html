<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <title>CRUD Táblázat</title>
  <link rel="stylesheet" href="../css/style.css">
  <script defer src="../js/tabla.js"></script>
</head>

<body>
  <header>
    <h1>Table</h1>
  </header>

  <nav class="menu">
    <a href="index.html">Kezdőlap</a>
    <a href="table.html">Táblázat</a>
    <a href="html5.html">HTML5</a>
    <a href="chart.html">Chart</a>
    <a href="ajax.html">AJAX</a>
    <a href="oojs.html">OOJS</a>
  </nav>

  <aside>
    <p>CRUD funkciók példája</p>
  </aside>

  <div class="content">
    <h2>CRUD Táblázat</h2>

    <form id="form">
      <input type="text" id="name" placeholder="Név" required minlength="2" maxlength="30">
      <input type="number" id="age" placeholder="Kor" required min="0" max="120">
      <input type="text" id="city" placeholder="Város" required minlength="2" maxlength="30">
      <input type="text" id="job" placeholder="Foglalkozás" required minlength="2" maxlength="30">
      <button type="submit">Hozzáadás / Módosítás</button>
      <input type="hidden" id="editIndex">
    </form>

    <input type="text" id="search" placeholder="Keresés...">

    <table id="dataTable">
      <thead>
        <tr>
          <th data-col="name">Név</th>
          <th data-col="age">Kor</th>
          <th data-col="city">Város</th>
          <th data-col="job">Foglalkozás</th>
          <th>Művelet</th>
        </tr>
      </thead>
      <tbody>

      </tbody>
    </table>
  </div>

  <footer>
    <p>Készítette: Győri Kitti ZUBQR0</p>
  </footer>
</body>

</html>
