<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header>
        <h1>Chart</h1>
      </header>

    <nav class="menu">
        <a href="index.html">Kezdőlap</a>
        <a href="table.html">Táblázat</a>
        <a href="html5.html">HTML5</a>
        <a href="chart.html">Chart</a>
        <a href="ajax.html">AJAX</a>
        <a href="oojs.html">OOJS</a>
      </nav>

    <table id="dataTable" border="1">
        <tbody>
            <tr>
                <td>10</td>
                <td>20</td>
                <td>30</td>
                <td>40</td>
                <td>50</td>
            </tr>
            <tr>
                <td>15</td>
                <td>25</td>
                <td>35</td>
                <td>45</td>
                <td>55</td>
            </tr>
            <tr>
                <td>12</td>
                <td>22</td>
                <td>32</td>
                <td>42</td>
                <td>52</td>
            </tr>
            <tr>
                <td>14</td>
                <td>24</td>
                <td>34</td>
                <td>44</td>
                <td>54</td>
            </tr>
            <tr>
                <td>11</td>
                <td>21</td>
                <td>31</td>
                <td>41</td>
                <td>51</td>
            </tr>
        </tbody>
    </table>

    <canvas id="myChart" width="400" height="200"></canvas>

<footer>Készítette: Buday Benedek OXQLH4</footer>
    <script>
        let chart; 

        document.querySelectorAll('#dataTable tr').forEach((row, rowIndex) => {
            row.addEventListener('click', () => {
                const values = Array.from(row.querySelectorAll('td')).map(cell => Number(cell.textContent));
                drawChart(values);
            });
        });

        function drawChart(data) {
            const ctx = document.getElementById('myChart').getContext('2d');

            if (chart) {
                chart.destroy(); 
            }

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['1.', '2.', '3.', '4.', '5.'], 
                    datasets: [{
                        label: 'Kiválasztott sor értékei',
                        data: data,
                        fill: false,
                        borderColor: 'rgb(75, 192, 192)',
                        tension: 0.1
                    }]
                }
            });
        }
    </script>

</body>

</html>
